<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViDUEVA Labs - Official Website</title>
    <style>
        /* ==========================================
           1. GENERAL STYLES (සාමාන්‍ය නිර්මාණය)
           ========================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* ==========================================
           2. HEADER SECTION (උඩම කොටස සහ Cover Image)
           ========================================== */
        header {
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.95), rgba(42, 82, 152, 0.95)), 
                        url('https://www.transparenttextures.com/patterns/cubes.png');
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 5px solid #28a745; 
        }
        
        .logo-container img {
            max-width: 150px; 
            height: auto;
            margin-bottom: 15px;
        }
        
        header h1 {
            margin: 0;
            font-size: 3em;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        header p {
            font-size: 1.4em;
            opacity: 0.9;
            margin-top: 10px;
            font-weight: 300;
        }

        /* ==========================================
           3. PRODUCTS SECTION (නිෂ්පාදන පෙන්වන කොටස)
           ========================================== */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1; 
        }
        
        .section-title {
            font-size: 2em;
            color: #1e3c72;
            margin-bottom: 30px;
            border-left: 5px solid #1e3c72;
            padding-left: 15px;
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .product-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .product-card:hover {
            transform: translateY(-5px); 
        }
        
        .product-card h3 {
            margin: 0 0 10px 0;
            color: #2a5298;
            font-size: 1.5em;
        }
        
        .product-card p {
            margin: 0 0 20px 0;
            color: #666;
            line-height: 1.6;
            flex: 1; 
        }
        
        .badge-android {
            background-color: #a4c639; 
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-block;
        }

        .btn {
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            display: block;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #218838;
        }

        /* ==========================================
           4. FOOTER SECTION (යටම පේළිය)
           ========================================== */
        footer {
            text-align: center;
            padding: 25px;
            background-color: #333;
            color: white;
            font-size: 0.9em;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            header { padding: 40px 20px; }
            header h1 { font-size: 2em; }
            header p { font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <!-- ======================================================== -->
    <!-- [CHANGE AREA 1]: HEADER & LOGO (ඔබේ ලාංඡනය වෙනස් කරන තැන) -->
    <!-- ======================================================== -->
    <header>
        <div class="logo-container">
            <!-- 
               * දැනට SVG අයිකන් එකක් දමා ඇත.
               * ඔබට අනාගතයේදී රූපයක් (Logo image) දැමීමට අවශ්‍ය නම්, 
                 පහත SVG කෝඩ් එක මකා දමා මෙලෙස ලියන්න:
                 <img src="YOUR_LOGO_IMAGE_LINK.png" alt="ViDUEVA Labs Logo">
            -->
            <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="16" fill="white"/>
                <path d="M25 70L50 25L75 70H60L50 52L40 70H25Z" fill="#1E3C72"/>
                <path d="M55 62H45V70H55V62Z" fill="#28A745"/>
            </svg>
        </div>
        <h1>ViDUEVA Labs</h1>
        <p>Crafting Digital Excellence</p>
    </header>


    <!-- ======================================================== -->
    <!-- [CHANGE AREA 2]: PRODUCTS/APPS LIST (ඇප්ස් එකතු කරන තැන) -->
    <!-- ======================================================== -->
    <div class="container">
        
        <div class="section-title">Our Products</div>

        <div class="product-grid">

            <!-- --- PRODUCT 1: Premium BMI Calculator --- -->
            <div class="product-card">
                <div class="product-info">
                    <span class="badge-android">Android App</span>
                    <h3>Premium BMI Calculator</h3>
                    <p>Calculate your Body Mass Index quickly, track history, and get health insights with our premium calculator.</p>
                </div>
                <!-- [CHANGE AREA 3]: Play Store Link එක දෙන තැන -->
                <!-- href="#" වෙනුවට Play Store Link එක දමන්න (ഉദാ: href="https://play.google.com/store/apps/details?id=...") -->
                <a href="#" class="btn" target="_blank">Download on Play Store</a>
            </div>


            <!-- ======================================================== -->
            <!-- [HOW TO ADD A NEW APP]:                                 -->
            <!-- අනාගතයේදී අලුත් ඇප් එකක් දැමීමට අවශ්‍ය නම්, පහත කොටස Copy කර -->
            <!-- මෙයට ඉහත කොටසට පහළින් Paste කරන්න:                        -->
            <!-- ======================================================== -->

                <div class="product-info">
                    <span class="badge-android">Android App</span>
                    <h3>New App Name Here</h3>
                    <p>Description of your new app goes here.</p>
                </div>
                <a href="YOUR_NEW_PLAY_STORE_LINK" class="btn" target="_blank">Download on Play Store</a>
            </div>
            -->

        </div>

    </div>


    <!-- ======================================================== -->
    <!-- [CHANGE AREA 4]: FOOTER (කොටු අඩියේ ඇති නම/වසර වෙනස් කිරීමට) -->
    <!-- ======================================================== -->
    <footer>
        <p>&copy; 2026 ViDUEVA Labs. All rights reserved.</p>
    </footer>

</body>
</html>
