<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViDUEVA Labs - Official Website</title>
    <!-- මෙතැනට අවශ්‍ය නම් Google Fonts හෝ CSS Style එකතු කරගත හැක -->
    <style>
        /* CSS STYLES: මේ කොටසෙන් වෙබ් අඩවියේ පෙනුම (Design) සකස් කරයි */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 1.8em;
            color: #1e3c72;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .app-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .app-info h3 {
            margin: 0 0 10px 0;
            color: #2a5298;
        }
        .app-info p {
            margin: 0;
            color: #666;
        }
        .btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #218838;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- HEADER SECTION: වෙබ් අඩවියේ උඩම කොටස (ব্র্যান্ড නම සහ හැඳින්වීම) -->
    <header>
        <h1>ViDUEVA Labs</h1>
        <p>Creating smart, efficient, and user-friendly Android applications.</p>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="container">
        
        <!-- APPS SECTION: ඔයාගේ ඇප්ස් ලැයිස්තුව පෙන්වන තැන -->
        <div class="section-title">Our Android Applications</div>

        <!-- APP 1: Premium BMI Calculator -->
        <div class="app-card">
            <div class="app-info">
                <h3>Premium BMI Calculator</h3>
                <p>Calculate your Body Mass Index quickly and track your health accurately.</p>
            </div>
            <!-- මෙතැනට Play Store Link එක දෙන්න පුළුවන් -->
            <a href="#" class="btn" target="_blank">Download on Play Store</a>
        </div>

        <!-- [අනාථයේදී තව ඇප් එකක් දැමුවහොත්, උඩ App Card එක Copy කරලා මෙතැනට Paste කරන්න] -->

    </div>

    <!-- FOOTER SECTION: යටම පේළිය -->
    <footer>
        <p>&copy; 2026 ViDUEVA Labs. All rights reserved.</p>
    </footer>

</body>
</html>
